name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: scripts/syllable-cli/go.mod
          cache-dependency-path: scripts/syllable-cli/go.sum

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          # Pinned: an unpinned upgrade (v2.17.1 -> v2.18.3) once reformatted the
          # cask unannounced. Bump deliberately; cask-verify tolerates reordering.
          version: "v2.18.3"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and merge the Homebrew cask PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci/merge_cask_pr.sh "${{ github.ref_name }}"
