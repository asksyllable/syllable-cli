name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: scripts/syllable-cli/go.mod
          cache-dependency-path: scripts/syllable-cli/go.sum

      - name: Format and vet
        working-directory: scripts/syllable-cli
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "::error::gofmt drift — run 'gofmt -w .' in scripts/syllable-cli"
            gofmt -l .
            exit 1
          fi
          go vet ./...

      - name: Run unit tests
        working-directory: scripts/syllable-cli
        # The integration suite is gated behind the `integration` build tag, so
        # plain ./... never compiles or runs it (see CONTRIBUTING.md).
        run: go test -race ./...
