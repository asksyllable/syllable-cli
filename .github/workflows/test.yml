name: Test

on:
  push:
    branches: [main]
  pull_request:
  # The spec-sync bot calls this on its own commit before recording `test`.
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: test-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Test CI automation scripts
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: scripts/syllable-cli/go.mod
          cache-dependency-path: scripts/syllable-cli/go.sum

      - name: Test spec drift detection
        run: python3 -m unittest discover -s .claude/skills/syllable-sync/scripts -p 'test_*.py'

      - name: Format and vet
        working-directory: scripts/syllable-cli
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "::error::gofmt drift — run 'gofmt -w .' in scripts/syllable-cli"
            gofmt -l .
            exit 1
          fi
          go vet ./...

      - name: Run unit tests
        working-directory: scripts/syllable-cli
        # The integration suite is gated behind the `integration` build tag, so
        # plain ./... never compiles or runs it (see CONTRIBUTING.md).
        run: go test -race ./...

      - name: Set up Node for SDK differential contracts
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/sdk-parity/package-lock.json

      - name: Install pinned SDK contract-test dependency
        run: npm ci --prefix tests/sdk-parity --ignore-scripts --no-audit --no-fund

      - name: Compare actual SDK and CLI HTTP contracts
        run: npm test --prefix tests/sdk-parity
