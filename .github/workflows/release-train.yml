name: Release Train

# Releases main automatically once it is live-checked. After every successful
# Spec Live Check on main (each push that touches the CLI, plus the daily
# run), scripts/ci/release_train.py decides whether the commits since the last
# tag include a releasable change and computes the version. The train then
# tags that exact live-checked commit, runs the Release workflow (build,
# publish, cask merge), and writes the release notes from the PRs.
#
# Majors never ship automatically: a breaking marker opens an issue instead.

on:
  workflow_run:
    workflows: ["Spec Live Check"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would be released"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-train
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: read
      actions: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Pick the newest live-checked main commit
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          sha="$RUN_SHA"
          if [ -z "$sha" ]; then
            sha="$(gh run list --workflow=spec-live-check.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha')"
          fi
          if [ -z "$sha" ]; then
            echo "::error::No successful live check on main to release from."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Decide what to release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci/release_train.py --candidate "${{ steps.candidate.outputs.sha }}" \
            --notes-out "$RUNNER_TEMP/notes.md" | tee -a "$GITHUB_OUTPUT"
          [ -f "$RUNNER_TEMP/notes.md" ] && cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Flag a breaking change for a human
        if: steps.plan.outputs.breaking == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LAST: ${{ steps.plan.outputs.last_tag }}
        run: |
          title="Release train held: breaking change since $LAST"
          if [ -z "$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')" ]; then
            gh issue create --title "$title" --assignee yorkable --body "The release train found a breaking-change marker (\`!:\` or \`BREAKING CHANGE\`) in the commits since $LAST, so it will not release automatically. Majors stay a human decision: tag the release by hand when ready, then close this issue."
          fi

      - name: Upload release notes
        if: steps.plan.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes.md

      - name: Tag the live-checked commit
        if: steps.plan.outputs.release == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists; not re-tagging."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG" "$SHA"
          git push origin "$TAG"

  release:
    needs: plan
    if: needs.plan.outputs.release == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}

  notes:
    needs: [plan, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ needs.plan.outputs.tag }}" --repo "${{ github.repository }}" --notes-file notes.md
