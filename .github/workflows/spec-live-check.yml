name: Spec Live Check

# Validates the CLI against the LIVE Syllable API, catching drift between the
# spec and reality (spec says X, server does Y) that a spec-vs-spec diff can't.
#
# Runs the black-box integration suite (scripts/syllable-cli/integration) which
# exercises the built binary against a live instance.
#
# GUARDRAIL: this must only ever touch a dedicated, non-customer CI org.
# Authentication is via SYLLABLE_API_KEY sourced from the SYLLABLE_CI_API_KEY
# secret — the key itself is the org boundary, so that secret MUST be a key for
# the dedicated CI org, never a customer key (see CONTRIBUTING.md). SYLLABLE_ORG
# is deliberately left unset: CI has no ~/.syllable/config.yaml, so the keyless
# SYLLABLE_API_KEY path is the only auth used, and there is no org slug to override.
#
# It runs only on trusted code (main), never on PR branches: the job holds the
# API key while it builds and runs the code it checks out. The release step
# requires a green run for the commit it releases.
#
# The integration tests create and delete real resources in the target org, so
# the CI org is mutated on every run — that is expected and acceptable. Runs
# never overlap, so two runs can't fight over the same test resources.

on:
  schedule:
    - cron: "0 14 * * *" # 14:00 UTC daily — offset one hour after spec-drift
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/syllable-cli/**"

permissions:
  contents: read

concurrency:
  group: spec-live-check
  cancel-in-progress: false

jobs:
  live-check:
    # Only main's code may run with the API key, even on a manual dispatch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SYLLABLE_API_KEY: ${{ secrets.SYLLABLE_CI_API_KEY }}
    steps:
      - name: Check for CI-org credentials
        id: guard
        run: |
          if [ -z "${SYLLABLE_API_KEY}" ]; then
            echo "::error::SYLLABLE_CI_API_KEY is unset; the live check cannot run."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: scripts/syllable-cli/go.mod
          cache-dependency-path: scripts/syllable-cli/go.sum

      - name: Build CLI
        working-directory: scripts/syllable-cli
        run: go build -o syllable .

      - name: Enable cli-test fixtures
        # The fixture IDs (repo variables) belong to the cli-test org. Use them
        # only if the CI key really is for that org; never print the org itself.
        working-directory: scripts/syllable-cli
        env:
          EXPECTED_SLUG: ${{ vars.SYLLABLE_TEST_ORG_SLUG }}
          AGENT_ID: ${{ vars.SYLLABLE_TEST_AGENT_ID }}
          SERVICE_ID: ${{ vars.SYLLABLE_TOOL_SERVICE_ID }}
          TOOL_ID: ${{ vars.SYLLABLE_TEST_TOOL_ID }}
          CHANNEL_ID: ${{ vars.SYLLABLE_TEST_CHANNEL_ID }}
        run: |
          slug="$(./syllable --request-timeout 60s organizations get -o json | jq -r '.slug // empty')"
          if [ -z "$EXPECTED_SLUG" ] || [ "$slug" != "$EXPECTED_SLUG" ]; then
            echo "::warning::The CI key is not for the cli-test org; fixture-gated tests stay skipped."
            exit 0
          fi
          phone="$(./syllable --request-timeout 60s channels twilio numbers-list "$CHANNEL_ID" -o json | jq -r '.phone_numbers[0].phone_number // empty')"
          [ -n "$phone" ] && echo "::add-mask::$phone"
          sample="$RUNNER_TEMP/voice-sample.json"
          echo '{"language_code":"en-US","voice_provider":"Google","voice_display_name":"Achernar (English)","text":"Integration test sample."}' > "$sample"
          {
            echo "SYLLABLE_TEST_AGENT_ID=$AGENT_ID"
            echo "SYLLABLE_TOOL_SERVICE_ID=$SERVICE_ID"
            echo "SYLLABLE_TEST_TOOL_ID=$TOOL_ID"
            echo "SYLLABLE_TEST_CHANNEL_ID=$CHANNEL_ID"
            echo "SYLLABLE_TEST_PHONE=$phone"
            echo "SYLLABLE_VOICE_SAMPLE_BODY_FILE=$sample"
          } >> "$GITHUB_ENV"
          echo "cli-test fixtures enabled."

      - name: Run live integration tests (CI org)
        working-directory: scripts/syllable-cli
        env:
          SYLLABLE_CLI_BINARY: ${{ github.workspace }}/scripts/syllable-cli/syllable
        run: go test -tags integration -count=1 -v ./integration/...
